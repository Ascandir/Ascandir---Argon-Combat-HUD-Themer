<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b46a"/>
      <stop offset="0.35" stop-color="#9a6a32"/>
      <stop offset="0.6" stop-color="#5e3d1c"/>
      <stop offset="1" stop-color="#b8843f"/>
    </linearGradient>
    <linearGradient id="bzv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2f14"/>
      <stop offset="0.5" stop-color="#c08a44"/>
      <stop offset="1" stop-color="#4a2f14"/>
    </linearGradient>
    <linearGradient id="bzh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f14"/>
      <stop offset="0.5" stop-color="#c08a44"/>
      <stop offset="1" stop-color="#4a2f14"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.45" stop-color="#b07a36"/>
      <stop offset="1" stop-color="#3a2410"/>
    </radialGradient>
    <g id="corner">
      <!-- L-förmiger Eckbeschlag -->
      <path d="M2 2 H40 V9 H13 Q9 9 9 13 V40 H2 Z" fill="url(#bz)" stroke="#120a04" stroke-width="1.5"/>
      <path d="M9 9 L22 9 L9 22 Z" fill="#2a1a0c" opacity="0.6"/>
      <!-- Raute mit Niete -->
      <path d="M17 4 L25 12 L17 20 L9 12 Z" fill="url(#bz)" stroke="#120a04" stroke-width="1.2" transform="translate(-1 -1)"/>
      <circle cx="16" cy="11" r="3.2" fill="url(#rivet)" stroke="#1a0f05" stroke-width="0.8"/>
      <!-- kleine Ranken -->
      <path d="M26 9.5 q6 -5 12 0" fill="none" stroke="#d9a75a" stroke-width="1.3"/>
      <path d="M9.5 26 q-5 6 0 12" fill="none" stroke="#d9a75a" stroke-width="1.3"/>
      <circle cx="34" cy="5.5" r="1.8" fill="url(#rivet)"/>
      <circle cx="5.5" cy="34" r="1.8" fill="url(#rivet)"/>
    </g>
  </defs>
  <!-- Kanten (werden gestreckt, daher gleichförmig) -->
  <rect x="1" y="1" width="118" height="118" fill="none" stroke="#0d0703" stroke-width="2"/>
  <rect x="2" y="2" width="116" height="4" fill="url(#bzh)"/>
  <rect x="2" y="114" width="116" height="4" fill="url(#bzh)"/>
  <rect x="2" y="2" width="4" height="116" fill="url(#bzv)"/>
  <rect x="114" y="2" width="4" height="116" fill="url(#bzv)"/>
  <rect x="6.5" y="6.5" width="107" height="107" fill="none" stroke="#0d0703" stroke-width="1.5"/>
  <rect x="9" y="9" width="102" height="102" fill="none" stroke="#7a5428" stroke-width="1" opacity="0.8"/>
  <rect x="10.5" y="10.5" width="99" height="99" fill="none" stroke="#000" stroke-width="1.5" opacity="0.6"/>
  <!-- Ecken -->
  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="translate(120 0) scale(-1 1)"/>
  <use xlink:href="#corner" transform="translate(0 120) scale(1 -1)"/>
  <use xlink:href="#corner" transform="translate(120 120) scale(-1 -1)"/>
</svg>
