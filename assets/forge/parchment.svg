<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" preserveAspectRatio="none">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="11"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.86
        0 0 0 0 0.77
        0 0 0 0 0.60
        0 0 0 -0.9 0.95"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.05" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.45
        0 0 0 0 0.33
        0 0 0 0 0.18
        0 0 0 0.5 -0.2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#5a3a1a" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#5a3a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a220c" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#e3d2ad"/>
  <rect width="400" height="300" filter="url(#paper)" opacity="0.55"/>
  <rect width="400" height="300" filter="url(#fibers)" opacity="0.25"/>
  <rect width="400" height="300" fill="url(#vig)"/>
</svg>
