<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.35" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.10
      0 0 0 0 0.06
      0 0 0 0 0.03
      0 0 0 1.4 -0.45"/>
  </filter>
  <filter id="speck" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.75
      0 0 0 0 0.55
      0 0 0 0 0.30
      0 0 0 0.6 -0.32"/>
  </filter>
  <rect width="256" height="256" fill="#5a3418" opacity="0.45"/>
  <rect width="256" height="256" filter="url(#grain)"/>
  <rect width="256" height="256" filter="url(#speck)" opacity="0.35"/>
</svg>
