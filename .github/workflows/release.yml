name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version im Manifest prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version module.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG passt nicht zur module.json-Version $VERSION" >&2
            exit 1
          fi

      - name: Modul-Paket bauen
        run: zip -r module.zip module.json README.md scripts styles languages assets

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG-latest.md
          files: |
            module.json
            module.zip
